services:
  # Driver container: runs the collectors and submits the Spark jobs
  python:
    build: .
    env_file:
      - .env
    volumes:
      - .:/CS4010
    tty: true
    stdin_open: true
    # Containers reach Kafka on its internal listener
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PYTHONPATH=/CS4010
    depends_on:
      - kafka
      - spark-master
      - mongodb

  # Single-node Kafka in KRaft mode; internal listener for containers, external for the host
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single broker, so every replication factor is 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # No rebalance delay, and 3 partitions per topic to spread load across workers
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # MongoDB for players, games and move evaluations; root credentials come from .env
  mongodb:
    image: mongo:8.0.29
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-supersecretpassword123}
    volumes:
      - mongodb_data:/data/db

  # Spark master, with its web UI on http://localhost:8080
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_HOME=/opt/spark
      - SPARK_SUBMIT_OPTS=-Divy.home=/tmp/.ivy2
      - PYSPARK_PYTHON=/usr/bin/python3.14
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3.14
    volumes:
      - .:/CS4010

  # Two Spark workers with 6 cores each; the repo is mounted so executors can import the analyzer
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_started
        restart: true
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_MEMORY=4g
      - PYSPARK_PYTHON=/usr/bin/python3.14
      - PYTHONPATH=/CS4010
    volumes:
      - .:/CS4010
    deploy:
      replicas: 2

# Persistent storage for MongoDB
volumes:
  mongodb_data: